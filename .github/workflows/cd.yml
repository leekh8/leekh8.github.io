name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # 🛑 ubuntu-latest 와 playwright 판은 ci.yml 의 build-seo 와 같이 움직인다.
    #    푸는 순서와 까닭은 그쪽 주석에 적어 뒀다. 기준은 Playwright 최신판이
    #    아니라 `yarn.lock` 의 `playwright-core`(지금 1.58.2) 다.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: gatsby

      - name: Install dependencies
        run: yarn install

      - name: Install Playwright Chromium (for Mermaid rendering)
        # 이 판은 yarn.lock 의 playwright-core 와 같아야 한다 (ci.yml 주석 참고).
        run: npx playwright@1.58.2 install --with-deps chromium

      - name: Build with Gatsby
        env:
          PREFIX_PATHS: "true"
          CHROMIUM_DIR: ${{ env.CHROMIUM_DIR }}
        run: |
          CHROMIUM_DIR=$(ls -d $HOME/.cache/ms-playwright/chromium-* | sort -V | tail -n 1)
          echo "CHROMIUM_DIR=$CHROMIUM_DIR" >> $GITHUB_ENV
          yarn clean
          yarn build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
