name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # 🛑 러너와 playwright 판은 ci.yml 의 build-seo 와 **같이 움직인다.**
    #    까닭과 11-10 에 깨뜨린 자취는 그쪽 주석에 적어 뒀다. 기준은 Playwright
    #    최신판이 아니라 `yarn.lock` 의 `playwright-core`(지금 1.65.0) 다.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: gatsby

      - name: Install dependencies
        run: yarn install

      - name: Install Playwright Chromium (for Mermaid rendering)
        # 🛑 **판 번호를 박지 않고 yarn.lock 에서 읽는다** (까닭은 ci.yml 주석).
        run: |
          PW=$(awk '/^playwright-core@/{f=1} f && /^  version /{gsub(/"/,"",$2); print $2; exit}' yarn.lock | tr -d '\r')
          echo "yarn.lock 의 playwright-core = ${PW}"
          if [ -z "${PW}" ]; then
            echo "::error::yarn.lock 에서 playwright-core 판을 못 읽었다. 의존성 모양이 바뀐 것이다"
            exit 1
          fi
          npx playwright@"${PW}" install --with-deps chromium

      # 🛑 **`CHROMIUM_DIR` 를 빼냈다** (11-11, 까닭은 ci.yml 주석). 값을 만드는
      #    줄과 `env:` 로 넘기던 줄이 둘 다 헛일이었다 - 읽는 쪽이 없고, `env:`
      #    는 run 블록보다 먼저 평가돼서 늘 빈 값이었다.
      - name: Build with Gatsby
        env:
          PREFIX_PATHS: "true"
        run: |
          yarn clean
          yarn build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
