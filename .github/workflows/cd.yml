name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # 🛑 ubuntu-latest 를 쓰면 안 된다. 2026-11-10 에 26.04 로 밀렸고
    #    `npx playwright@1.58.2 install` 이 «does not support chromium on
    #    ubuntu26.04-x64» 로 멈춘다. 10-20 에 통과한 런의 이미지는
    #    ubuntu-24.04 였다. Playwright 판을 올릴 때 이 고정을 푼다.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: gatsby

      - name: Install dependencies
        run: yarn install

      - name: Install Playwright Chromium (for Mermaid rendering)
        run: npx playwright@1.58.2 install --with-deps chromium

      - name: Build with Gatsby
        env:
          PREFIX_PATHS: "true"
          CHROMIUM_DIR: ${{ env.CHROMIUM_DIR }}
        run: |
          CHROMIUM_DIR=$(ls -d $HOME/.cache/ms-playwright/chromium-* | sort -V | tail -n 1)
          echo "CHROMIUM_DIR=$CHROMIUM_DIR" >> $GITHUB_ENV
          yarn clean
          yarn build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
