name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # Playwright 1.61 부터 Ubuntu 26.04 를 지원한다(릴리스 노트 "Playwright now
    # supports Ubuntu 26.04.", 이슈 #40117 이 v1.61 로 닫혔다). 그래서 11-10 에
    # 걸어 둔 ubuntu-24.04 고정을 풀었다. 1.58.2 로는 26.04 에서
    # «does not support chromium on ubuntu26.04-x64» 로 멈췄다.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: gatsby

      - name: Install dependencies
        run: yarn install

      - name: Install Playwright Chromium (for Mermaid rendering)
        run: npx playwright@1.65.0 install --with-deps chromium

      - name: Build with Gatsby
        env:
          PREFIX_PATHS: "true"
          CHROMIUM_DIR: ${{ env.CHROMIUM_DIR }}
        run: |
          CHROMIUM_DIR=$(ls -d $HOME/.cache/ms-playwright/chromium-* | sort -V | tail -n 1)
          echo "CHROMIUM_DIR=$CHROMIUM_DIR" >> $GITHUB_ENV
          yarn clean
          yarn build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
