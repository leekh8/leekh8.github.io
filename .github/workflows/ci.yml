name: CI

# 트리거가 pull_request 전용이면 main 에 직접 push 할 때 아래 build job 이 아예 안 돈다.
# 이 저장소는 브랜치 보호를 관리자 권한으로 우회해 직접 push 하는 운용이라, 정작
# 색인 계약 검사가 필요한 커밋에서 검사가 빠져 있었다(2026-09-22 확인, 2026-09-29 조치).
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # lint 와 prettier 는 PR 에서만 본다. 저장소 전체가 오래 깨져 있어 push 마다 돌리면
  # main 이 상시 빨간불이 되고, 그러면 아래 build 의 실패를 아무도 못 알아본다.
  # 빨간불이 기본값이 되는 순간 검사는 있으나 마나다.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: yarn install

      - name: Check lint
        run: yarn check:lint

      - name: Check prettier
        run: yarn check:prettier

  # 빌드와 색인 검사는 check와 분리한다.
  #
  # 한 job에 이어 붙이면 앞 단계가 실패할 때 빌드가 아예 안 돈다. 실제로 prettier는
  # 저장소 전체에서 오래 깨져 있었고(main 커밋 812개 중 PR 머지 1건뿐이라 이 검사가
  # 거의 돌지 않았다), 그 뒤에 빌드를 두면 정작 중요한 검사가 영영 실행되지 않는다.
  # 필수 상태 검사는 체크런 "이름"으로만 매칭된다. cd.yml 에도 build 라는 job 이 있어
  # 그대로 두면 브랜치 보호 설정에서 둘을 구분할 수 없고, 배포용 빌드가 이 검사 자리를
  # 대신 채워 줄 여지가 생긴다. 지목할 이름을 고유하게 둔다.
  build:
    name: build-seo
    # 🛑 **아래 playwright 판 번호를 혼자 올리면 안 된다.** 기준은 Playwright
    #    최신판이 아니라 `yarn.lock` 의 `playwright-core` 다. mermaid 를 그리는
    #    mermaid-isomorphic 이 `playwright-core@^1.0.0` 을 끌어오고, 빌드할 때
    #    **그 판이 기대하는 브라우저 리비전**을 찾는다.
    #
    #    11-10 에 npx 만 1.65.0 으로 올려 봤다가 배포가 깨졌다. 설치는 통과하고
    #    빌드가 «browserType.launch: Executable doesn't exist at
    #    .../chromium_headless_shell-1208/...» 로 죽는다. 1.65.0 이 깔아 둔
    #    리비전과 1.58.2 가 찾는 리비전이 달라서다. 설치 단계가 초록불이라
    #    원인이 러너나 Playwright 판으로 보인다 - 아니다, **두 판이 어긋난 것**이다.
    #
    #    11-11 에 셋을 한 묶음으로 올렸다.
    #      yarn.lock 의 playwright-core  1.58.2 -> 1.65.0
    #      아래 npx                      1.58.2 -> 1.65.0
    #      러너                          ubuntu-24.04 -> ubuntu-latest
    #
    #    러너를 풀 수 있는 근거는 Playwright **1.61** 이다 (릴리스 노트
    #    "Playwright now supports Ubuntu 26.04.", 이슈 #40117 이 v1.61 로 닫혔다).
    #    1.58.2 로는 26.04 에서 «does not support chromium on ubuntu26.04-x64».
    #
    #    다시 손댈 때도 셋을 같이 본다. 하나만 움직이면 깨진다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: yarn install

      - name: Install Playwright Chromium (for Mermaid rendering)
        # 🛑 **판 번호를 박지 않고 yarn.lock 에서 읽는다.** 박아 두면 둘이
        #    어긋나고, 어긋나면 설치는 초록불인데 빌드가 죽는다 (11-10 사고).
        #    읽어 쓰면 어긋날 자리가 아예 없어진다.
        #    `tr -d` 는 yarn.lock 이 CRLF 로 체크아웃될 때를 막는다.
        run: |
          PW=$(awk '/^playwright-core@/{f=1} f && /^  version /{gsub(/"/,"",$2); print $2; exit}' yarn.lock | tr -d '\r')
          echo "yarn.lock 의 playwright-core = ${PW}"
          if [ -z "${PW}" ]; then
            echo "::error::yarn.lock 에서 playwright-core 판을 못 읽었다. 의존성 모양이 바뀐 것이다"
            exit 1
          fi
          npx playwright@"${PW}" install --with-deps chromium

      # 🛑 **`CHROMIUM_DIR` 를 만들던 두 줄을 뺐다** (11-11). 아무도 안 읽었다.
      #    `grep -r CHROMIUM_DIR` 로 저장소를 훑으면 이 워크플로 둘과 그 오류를
      #    다룬 블로그 글에만 있었다. gatsby-remark-mermaid 는 이 변수를 보지
      #    않고 playwright 의 기본 캐시 자리에서 브라우저를 찾는다.
      #    같은 단계의 `env:` 에 적어 둔 것도 run 블록보다 먼저 평가돼서 늘 빈
      #    값이었다 - **값을 만드는 줄과 쓰는 줄이 둘 다 헛일이었다.**
      - name: Build with Gatsby
        run: |
          yarn clean
          yarn build

      # 색인 계약 검사. 스크립트 본문에 왜 이렇게 하는지 적어 뒀다.
      #
      # 워크플로우 안에 셸로 짜지 않는 이유는 두 번 틀려서다. grep이 한글 섞인 HTML을
      # 바이너리로 판단해 매치 내용을 안 주는 것과, HTML의 &amp; 가 파일 경로의 & 와
      # 안 맞는 것. HTML을 줄 단위 텍스트 도구로 다루면 이런 식으로 샌다.
      - name: Verify build SEO contracts
        run: node scripts/verify-build-seo.js
