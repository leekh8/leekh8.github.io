name: CI

# 트리거가 pull_request 전용이면 main 에 직접 push 할 때 아래 build job 이 아예 안 돈다.
# 이 저장소는 브랜치 보호를 관리자 권한으로 우회해 직접 push 하는 운용이라, 정작
# 색인 계약 검사가 필요한 커밋에서 검사가 빠져 있었다(2026-09-22 확인, 2026-09-29 조치).
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # lint 와 prettier 는 PR 에서만 본다. 저장소 전체가 오래 깨져 있어 push 마다 돌리면
  # main 이 상시 빨간불이 되고, 그러면 아래 build 의 실패를 아무도 못 알아본다.
  # 빨간불이 기본값이 되는 순간 검사는 있으나 마나다.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: yarn install

      - name: Check lint
        run: yarn check:lint

      - name: Check prettier
        run: yarn check:prettier

  # 빌드와 색인 검사는 check와 분리한다.
  #
  # 한 job에 이어 붙이면 앞 단계가 실패할 때 빌드가 아예 안 돈다. 실제로 prettier는
  # 저장소 전체에서 오래 깨져 있었고(main 커밋 812개 중 PR 머지 1건뿐이라 이 검사가
  # 거의 돌지 않았다), 그 뒤에 빌드를 두면 정작 중요한 검사가 영영 실행되지 않는다.
  # 필수 상태 검사는 체크런 "이름"으로만 매칭된다. cd.yml 에도 build 라는 job 이 있어
  # 그대로 두면 브랜치 보호 설정에서 둘을 구분할 수 없고, 배포용 빌드가 이 검사 자리를
  # 대신 채워 줄 여지가 생긴다. 지목할 이름을 고유하게 둔다.
  build:
    name: build-seo
    # 🛑 ubuntu-latest 를 쓰면 안 된다. 2026-11-10 에 26.04 로 밀렸다.
    #
    # 🛑 그리고 아래 playwright 판 번호를 혼자 올려도 안 된다. 기준은 Playwright
    #    최신판이 아니라 `yarn.lock` 의 `playwright-core` 다. mermaid 를 그리는
    #    mermaid-isomorphic 이 `playwright-core@^1.0.0` 을 끌어오고, 그 판이
    #    기대하는 브라우저 리비전을 찾는다. 지금 yarn.lock 은 1.58.2 다.
    #
    #    11-10 에 1.65.0 으로 올려 봤다가 배포가 깨졌다. 설치는 통과하는데
    #    빌드가 «browserType.launch: Executable doesn't exist at
    #    .../chromium_headless_shell-1208/...» 로 죽는다. 1.65.0 이 깔아 둔
    #    리비전과 1.58.2 가 찾는 리비전이 다르기 때문이다.
    #
    #    고정을 풀려면 순서가 있다. 먼저 `playwright-core` 를 1.61 이상으로
    #    올리고(그 판이 26.04 를 지원한다 - 릴리스 노트 "Playwright now supports
    #    Ubuntu 26.04."), 그 판 번호를 아래 npx 에도 맞추고, 그다음 이 줄을 푼다.
    #    셋이 한 묶음이다.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: yarn install

      - name: Install Playwright Chromium (for Mermaid rendering)
        # 이 판은 yarn.lock 의 playwright-core 와 같아야 한다 (위 주석 참고).
        run: npx playwright@1.58.2 install --with-deps chromium

      - name: Build with Gatsby
        run: |
          CHROMIUM_DIR=$(ls -d $HOME/.cache/ms-playwright/chromium-* | sort -V | tail -n 1)
          echo "CHROMIUM_DIR=$CHROMIUM_DIR" >> $GITHUB_ENV
          yarn clean
          yarn build

      # 색인 계약 검사. 스크립트 본문에 왜 이렇게 하는지 적어 뒀다.
      #
      # 워크플로우 안에 셸로 짜지 않는 이유는 두 번 틀려서다. grep이 한글 섞인 HTML을
      # 바이너리로 판단해 매치 내용을 안 주는 것과, HTML의 &amp; 가 파일 경로의 & 와
      # 안 맞는 것. HTML을 줄 단위 텍스트 도구로 다루면 이런 식으로 샌다.
      - name: Verify build SEO contracts
        run: node scripts/verify-build-seo.js
