name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: yarn install

      - name: Check lint
        run: yarn check:lint

      - name: Check prettier
        run: yarn check:prettier
